<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;background:#090e15;color:#f0f5f5;-webkit-tap-highlight-color:transparent}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:default}
#app{min-height:100dvh;max-width:480px;margin:auto;background:#0e151e;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.page{padding:24px 17px 112px}.kicker{text-transform:uppercase;letter-spacing:.17em;color:#8eaa9e;font-size:11px;font-weight:800}.h1{font-size:32px;line-height:1.1;font-weight:820;letter-spacing:-.05em;margin:7px 0}.muted{color:#96a3b1;font-size:13px}.panel{background:#16202b;border:1px solid #293a43;border-radius:19px;padding:16px;margin-top:12px}.hero{background:linear-gradient(135deg,#173f32,#182530);border-color:#2d654d}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:23px}.tiny{font-size:11px;color:#8095a4}.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:22px}.daytile{border:1px solid #34414f;background:#1b2631;color:#d7e0e4;border-radius:13px;height:49px;font-size:15px;font-weight:800}.daytile small{display:block;font-size:9px;margin-top:2px;font-weight:500;color:#9ba9b4}.daytile.active{border:2px solid #7de0aa;color:#b6f4cb;background:#19372d}.daytile.done{border-color:#222d37;color:#52616a;background:#111b25}
.card{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:#17232e;border:1px solid #293741;border-radius:15px;padding:14px;color:#f2f6f7;margin-top:9px}.card.done{opacity:.37}.card.active{border-color:#5cb98c;background:#16352b}.num{font-weight:900;font-size:20px;color:#9ce7b8;min-width:29px}.grow{flex:1}.card h3{margin:0 0 5px;font-size:15px}.card p{margin:0;color:#91a1af;font-size:11px}.chev{font-size:24px;color:#8da49b}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.stat{background:#18232e;border-radius:14px;padding:12px 9px}.bigstat{font-size:20px;font-weight:800;white-space:nowrap}.label{font-size:10px;color:#9cabb7;margin-top:5px}.bar{height:7px;border-radius:8px;background:#2b3c42;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;background:#86e6ab;transition:width .25s}
.btn{border:none;border-radius:13px;padding:13px 15px;font-weight:750;color:#0d2517;background:#9ce8b8;width:100%;margin-top:14px}.btn.secondary{background:#22303b;color:#d0e4dc;border:1px solid #394a55}.btn.danger{background:#442728;color:#f8cece}.smallbtn{border:1px solid #364957;border-radius:10px;background:#22313c;color:#e2eeeb;padding:9px 13px;font-size:13px}.section{font-weight:800;margin:22px 0 7px}.exercise{background:#15202a;border:1px solid #283741;border-radius:18px;padding:14px;margin-top:13px}.exercise.done{border-color:#1b292d}.extitle{font-weight:790;font-size:16px;line-height:1.25}.exmeta{font-size:12px;color:#8ea0ac;margin-top:5px}.control{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:14px 0}.counter{display:flex;align-items:center;gap:8px}.counter button{background:#283b44;border:1px solid #354c55;color:#e3eee7;font-weight:850;border-radius:10px;min-width:35px;height:36px}.counter input{background:#0f1a22;color:white;width:58px;border:1px solid #3d545d;border-radius:9px;padding:7px;text-align:center}.set{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #28343f;padding:12px 0}.set.done{opacity:.36}.set:last-child{padding-bottom:0}.times{display:flex;gap:5px}.times button{background:#244335;color:#baffd1;padding:10px;border:1px solid #3f775d;border-radius:9px;font-size:12px;font-weight:750}.clockbox{display:flex;justify-content:space-between;align-items:center;background:#182b2a;border:1px solid #27584b;padding:14px;border-radius:16px;margin:15px 0}.timer{font-size:29px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.rest{background:#153b2c;border:1px solid #338d66;border-radius:18px;padding:16px;margin-top:12px}.rest .timer{font-size:40px;color:#b1f2ca}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(3,1fr);background:#111b25;border-top:1px solid #29333e;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.tabbar button{border:0;background:transparent;color:#a2b0b8;font-size:11px;padding:8px 0}.tabbar button b{display:block;font-size:20px;margin-bottom:3px}.tabbar button.sel{color:#a9edc5}
.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.reportmetric{background:#1a2a32;padding:15px;border-radius:15px}.reportmetric b{display:block;font-size:25px;margin-bottom:7px}.reportmetric span{color:#91a0ae;font-size:12px}
tr{border-bottom:1px solid #2c3944}td{padding:10px 3px;font-size:12px}table{width:100%;border-collapse:collapse}td:nth-child(2),td:nth-child(3){text-align:right}td:last-child{white-space:nowrap}.positive{color:#80d9a2}.note{color:#98a9ae;background:#19242d;border-radius:13px;padding:13px;font-size:12px;line-height:1.5;margin-top:12px}.toast{position:fixed;z-index:5;bottom:95px;left:50%;transform:translateX(-50%);background:#28473a;color:#e8ffef;padding:11px 16px;border-radius:13px;font-size:13px;width:max-content;max-width:90%;box-shadow:0 12px 30px #0009}.hidden{display:none}.two{display:flex;gap:8px}.two>*{flex:1}.install{background:#21342c;padding:12px;border-radius:12px;font-size:12px;color:#c5e4d2}

/* iPhone-friendly workout ordering: drag only from the grip, not from the card body */
.workout-list{margin-top:9px}
.workout-row{display:flex;align-items:center;padding:0;gap:0;transition:border-color .12s,opacity .12s}
.card-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 10px 14px 14px;color:inherit;background:transparent;border:0;border-radius:15px}
.card-main .grow{min-width:0}
.card-main .grow h3{margin:0 0 5px}
.card-main .grow p{margin:0}
.draghandle{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;flex:0 0 46px;min-height:64px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-left:1px solid #30424d;color:#a3d3bd;font-size:28px;cursor:grab}
.draghandle:active{cursor:grabbing}
.draghandle:focus-visible{outline:2px solid #a3f3ca;outline-offset:-2px}
.workout-row.drop-target{border:2px solid #b2f5ca;background:#214635;box-shadow:0 0 0 2px #35654d}
.workout-row.dragging{opacity:.35}
.dragghost{position:fixed;pointer-events:none;z-index:500;display:flex;align-items:center;min-height:60px;background:#2a5642;border:2px solid #a9f6c7;color:#f3fff7;box-shadow:0 14px 35px #0009;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:800}
.drag-instruction{margin:0 0 5px;font-size:12px}
