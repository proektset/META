/* META interface · cold and warm themes from the current corporate system */
:root[data-theme="cold"]{
 --bg:#eef5f7;--surface:#fff;--side:#f6faf8;--line:#c9d8d2;
 --text:#3d5559;--muted:#607b7d;--accent:#427e73;--accent-soft:#e1f0eb;
 --gold:#7fab9a;--blue:#337e9a;--good:#288767;--bad:#c35755;
 --shadow:0 9px 28px rgba(57,99,88,.09)
}
:root[data-theme="warm"]{
 --bg:#fff8e7;--surface:#fffdf6;--side:#fff8e4;--line:#ecd79f;
 --text:#533f18;--muted:#7d6427;--accent:#a76e0d;--accent-soft:#fff0b5;
 --gold:#e2aa2b;--blue:#8a6a20;--good:#8a9228;--bad:#ce6a3b;
 --shadow:0 9px 28px rgba(172,119,18,.12)
}
.app.presenting .sidebar,.app.presenting .rail{display:none}
.theme-control{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid var(--line);background:var(--bg);border-radius:12px;white-space:nowrap;min-width:0}
.theme-choice{background:transparent;border:1px solid transparent;border-radius:9px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.2;padding:8px 12px;white-space:nowrap}
.theme-choice[aria-pressed="true"]{color:var(--text);background:var(--surface);border-color:var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
:root[data-theme="warm"] .theme-choice[aria-pressed="true"]{background:linear-gradient(125deg,#ffe392,#ffefbd);border-color:#dba73c}
:root[data-theme="cold"] .theme-choice[aria-pressed="true"]{background:linear-gradient(125deg,#d7e9e3,#f5fbf8);border-color:#97bdb2}
.tabs{gap:8px}.tabs .tab{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13px;padding:10px 17px}
.tabs .demo-launch{margin-left:9px;border-color:var(--gold);color:var(--accent)}
.tabs .demo-launch.is-on{background:var(--accent);border-color:var(--accent);color:#fff}
.graph-stage{background:var(--bg)!important}
.graph-scene svg .diagram-zone{stroke:var(--zone-stroke,#97aab6)!important;fill:none!important;stroke-width:2!important;stroke-dasharray:11 13!important}
:root[data-theme="warm"]{--zone-stroke:#d6be80}
:root[data-theme="cold"]{--zone-stroke:#9cbbb7}
/* Corporate warm card colors while preserving the original semantic scheme. */
:root[data-theme="warm"] .diagram-card rect{stroke:#d6a54b;fill:#ffebad}
:root[data-theme="warm"] .diagram-card text{fill:#634a17}
:root[data-theme="warm"] .diagram-card[data-diagram-id="goal"] rect{fill:#94621b;stroke:#94621b}
:root[data-theme="warm"] .diagram-card[data-diagram-id="goal"] text{fill:#fff}
:root[data-theme="warm"] .diagram-card[data-diagram-id="blocked"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="rework"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="rupture"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="deadlines"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="deficit"] rect{fill:#ffdfca;stroke:#d98865}
:root[data-theme="warm"] .diagram-card[data-diagram-id="stable"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="sufficient"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="staff"] rect{fill:#eaf2cc;stroke:#b2bb77}
:root[data-theme="warm"] .diagram-card[data-diagram-id="redesign"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="changes"] rect,
:root[data-theme="warm"] .diagram-card[data-diagram-id="stability"] rect{fill:#f6ddc0;stroke:#c6a177}
:root[data-theme="warm"] .diagram-card[data-diagram-id="comparison"] polygon{fill:#ffdf96;stroke:#ce9d3d}
:root[data-theme="warm"] .diagram-card[data-diagram-id="cost"] rect{fill:#fff1c9}
.diagram-card rect,.diagram-card polygon{transition:fill .25s ease,stroke .25s ease,filter .18s ease}
/* In presentation mode nodes appear one at a time, including their arrows, feedback loops, and hotspots. */
#architectureSvg [data-diagram-id],#architectureSvg [data-edge],#architectureSvg [data-edge-note],#architectureSvg .svg-hotspot{transition:opacity .24s ease}
#architectureSvg .demo-hidden{opacity:0!important;pointer-events:none!important;visibility:hidden!important}
#architectureSvg .demo-newest rect,#architectureSvg .demo-newest polygon{filter:drop-shadow(0 0 17px rgba(210,150,41,.60));stroke-width:5}
.presentation-panel{position:absolute;top:15px;right:18px;left:auto;transform:none;z-index:5;width:min(450px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:14px 16px;max-height:calc(100% - 30px);overflow-y:auto}
.presentation-panel[hidden]{display:none!important}
.presentation-title{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.presentation-live-dot{background:var(--good);border-radius:50%;width:9px;height:9px;box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.presentation-progress{margin-left:auto;letter-spacing:normal;background:var(--accent-soft);padding:4px 9px;border-radius:10px;font-weight:800;color:var(--text)}
.presentation-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
.presentation-row{display:flex;align-items:center;gap:12px;margin-top:11px;font-size:12px;font-weight:700}
.presentation-row label{white-space:nowrap;color:var(--muted)}
.presentation-row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--bg);color:var(--text)}
.presentation-now{margin-top:12px;min-height:21px;color:var(--text);font-size:13px;font-weight:750}
.presentation-actions{display:flex;gap:8px;margin-top:10px}
.presentation-actions button{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:12px;font-weight:750;min-height:38px;padding:7px 13px}
.presentation-actions button:disabled{opacity:.35;cursor:not-allowed}
.presentation-actions #demoPrev,.presentation-actions #demoNext{flex:1}
.presentation-actions .presentation-next{background:var(--accent);border-color:var(--accent);color:#fff}
.presentation-hotkeys{font-size:10px;color:var(--muted);margin-top:9px}
:root[data-theme="warm"] .presentation-live-dot{background:#e2a10b}
@media(max-width:1150px){.motto,.dept{display:none}.theme-choice{padding:7px 9px}.topbar{gap:7px}.tabs{padding-left:10px}}
@media(max-width:750px){
 .topbar{gap:4px;padding:0 8px}.topbar .brand{font-size:14px}.topbar .brand .sub{display:none}
 .topbar .headerbtn{height:30px;min-width:30px;padding:5px;font-size:0!important}
 #instructionBtn{display:inline-flex!important;align-items:center;justify-content:center}
 #instructionBtn::before{content:"ⓘ";font-size:16px}
 #exportBtn::before{content:"⇩";font-size:17px}
 #importBtn::before{content:"⇧";font-size:17px}
 .theme-control{padding:2px;flex:none}
 .theme-choice{padding:5px 8px;font-size:0!important;min-width:26px}
 .theme-choice[data-theme-choice="cold"]::before{content:"Х";font-size:12px}
 .theme-choice[data-theme-choice="warm"]::before{content:"Т";font-size:12px}
 .tabs{overflow-x:auto}.tabs .tab{padding:9px 12px;font-size:11px}
 .presentation-panel{top:8px;padding:11px}.presentation-hotkeys{display:none}
}

/* v1.3 — incremental architecture, causal tracing and narrator controls */

ственное и качественное состояние, ради которого существует система.","meaning":"Цель формулирует конечный результат и требования к объёму, сроку, качеству, себестоимости. Поток строится от цели, а не от текущей численности или привычных функций.","actions":["Зафиксировать метрики результата и временной горизонт.","Связать цель с производственной программой.","Назначить держателя системы и держателей сквозных потоков."],"formula":"","owner":"Держатель системы","inputs":"","outputs":"Целевой результат и критерии приемки","linked":["decomp","functions"],"example":"Целевой ввод: 130 000 м²/год с 2029 года; дальнейший прирост +5 000 м² ежегодно.","status":"Действует"},"decomp":{"id":"decomp","title":"Декомпозиция цели","group":"Цель и объём","brief":"Перевод конечной цели в измеримую программу работ.","meaning":"Из годового целевого ввода последовательно получаем объём реализации по годам, число объектов, параллельные стадии, требования к срокам и потребность в мощности.","actions":["Определить год ввода, горизонт и динамику объёма.","Разложить объём по объектам и стадиям жизненного цикла.","Сопоставить с портфелем, календарём и продолжительностью строительства."],"formula":"Q(год) = Q₀ + прирост × (год − старт)","owner":"","inputs":"","outputs":"","linked":["goal","qtarget"],"example":"При вводе 130 000 м²/год и цикле строительства 2 года одновременно в стройке ориентировочно 260 000 м².","status":"Действует"},"qtarget":{"id":"qtarget","title":"Требуемый производственный объём","group":"Цель и объём","brief":"Сколько результата поток обязан выдавать за единицу времени.","meaning":"Требуемый объём нельзя напрямую подменять годовой загрузкой проектировщиков. Необходимо учитывать параллельность стадий, календарные пики и готовность работ.","actions":["Установить Qцель по календарю и стадиям.","Разделить годовой ввод и объём в активной реализации."],"formula":"Qцель = целевой результат за период","owner":"","inputs":"","outputs":"","linked":["decomp","comparison"],"example":"При типовом объекте 40 000 м² программа 130 000 м²/год эквивалентна 3,25 объектам ввода в год.","status":"Действует"},"functions":{"id":"functions","title":"Функции","group":"Функции и ресурсы","brief":"Что система обязана делать для достижения цели.","meaning":"Функция — системная способность создавать полезный результат. Не равна должности или подразделению: сначала функция, затем задачи, роли и организационное распределение.","actions":["Проверять необходимость каждой функции с позиции результата.","Раскрывать функцию до задач и связанных процессов.","Исключать дубли и непроизводительные функции."],"formula":"","owner":"Держатель системы","inputs":"","outputs":"","linked":["goal","tasks","redesign"],"example":"Развитие архитектурной эффективности, оптимизация решений, стандартизация и систематизация.","status":"Действует"},"tasks":{"id":"tasks","title":"Задачи","group":"Функции и ресурсы","brief":"Единица конкретной работы, из которой складываются процессы и трудоёмкость.","meaning":"У каждой задачи должны быть исполнитель, результат, критерий качества, единица измерения, трудоёмкость и привязка к подпроцессу. Нельзя создать задачу без связи с ответственностью.","actions":["Назначить исполнителя / роль.","Описать единицу результата и норму трудоёмкости.","Установить связь с подпроцессом и входом/выходом."],"formula":"","owner":"","inputs":"","outputs":"","linked":["functions","role","sub"],"example":"Проверка КЭП типового этажа; результат — расчёт и протокол отклонений.","status":"Действует"},"role":{"id":"role","title":"Исполнители и роли","group":"Функции и ресурсы","brief":"Кто выполняет работу и несёт ответственность за результат.","meaning":"Роль обеспечивает выполнение задачи. Исполнитель отвечает за свою задачу, держатель потока — за сквозной результат и срок; держатель системы — за архитектуру всей модели. Должность не заменяет ответственности за поток.","actions":["Связать задачи с фактическими исполнителями.","Учитывать доступность и совместимость ресурсов.","Разделить ответственность исполнителя, ГИП ТЗ и держателя потока."],"formula":"","owner":"Руководитель подразделения / держатель потока","inputs":"","outputs":"","linked":["tasks","labor","staff"],"example":"","status":"Действует"},"labor":{"id":"labor","title":"Трудоёмкость на единицу","group":"Функции и ресурсы","brief":"Норматив затрат рабочего времени на единицу работы.","meaning":"Рассчитывается сначала на единицу задачи или продукта. Далее переводится в годовую программу работ, трудоёмкость цели и календарную загрузку с учётом перекрывающихся стадий.","actions":["Задать измеряемую единицу работы.","Установить нормы времени и источник фактических данных.","Считать среднюю и пиковую загрузку по исполнителям и периодам."],"formula":"Hцель = Σ(Nᵢ × Tᵢ); FTE = Hцель / H₁шт","owner":"","inputs":"","outputs":"","linked":["role","nom","methodology"],"example":"Использовать рабочие дни (РД) на единицу, а не сразу на годовую цель.","status":"Действует"},"nom":{"id":"nom","title":"Номинальная мощность","group":"Функции и ресурсы","brief":"Потенциальная выработка ресурсов до процессных потерь.","meaning":"Определяется составом исполнителей, фондом рабочего времени, квалификацией, нормами трудоёмкости и графиком работ. Не гарантирует фактическую пропускную способность.","actions":["Определить доступный фонд часов / РД.","Проверить календарное наложение стадий.","Направить мощность на проверку узких мест."],"formula":"Mном = доступный фонд времени / трудоёмкость на единицу","owner":"","inputs":"","outputs":"","linked":["labor","loss"],"example":"При параллельных стадиях по разным объектам учитывать пики по месяцам, а не только средний FTE.","status":"Действует"},"sub":{"id":"sub","title":"Подпроцессы","group":"Процессы и поток","brief":"Группа связанных задач, создающая промежуточный результат.","meaning":"Подпроцесс имеет измеримый выход, держателя, входные условия, срок и критерии передачи. Без связи с задачами, ролями и результатом карточка остаётся названием.","actions":["Собрать задачи по одному промежуточному результату.","Назначить держателя потока / ответственного за результат.","Фиксировать входы, выходы, SLA, статус и узкие места."],"formula":"","owner":"","inputs":"","outputs":"","linked":["tasks","proc","flowowner"],"example":"Квартирография, сводное задание, эскизный проект, проверка архитектурной эффективности.","status":"Действует"},"proc":{"id":"proc","title":"Процессы","group":"Процессы и поток","brief":"Последовательность подпроцессов, преобразующих вход в результат.","meaning":"Производственный процесс реализует создание ценности; процесс взаимодействия обеспечивает передачу результата без потерь между участниками. Это разные компоненты одной системы.","actions":["Проверить последовательность и зависимости.","Выявить точки передачи результата.","Назначить SLA и контроль качества."],"formula":"","owner":"","inputs":"","outputs":"","linked":["sub","prod","interaction","flowowner"],"example":"","status":"Действует"},"prod":{"id":"prod","title":"Производственные процессы","group":"Процессы и поток","brief":"Непосредственное создание продукта и потребительской ценности.","meaning":"Результаты производственных процессов проверяются на качество и себестоимость. При отклонении по качеству возникает возврат, дополнительная трудоёмкость и повторное прохождение стадии.","actions":["Фиксировать производственный результат каждой стадии.","Сопоставлять с критериями качества и нормативом себестоимости."],"formula":"","owner":"","inputs":"","outputs":"","linked":["proc","quality","rework","loss","methodology"],"example":"Поток проектирования: квартирография → сводное задание → ЭП → проверка архитектурной эффективности.","status":"Действует"},"interaction":{"id":"interaction","title":"Процессы взаимодействия","group":"Процессы и поток","brief":"Механизм передачи задач и результатов между ролями и подразделениями.","meaning":"Взаимодействие имеет входные условия, договорённый формат передачи, держателя, срок и правило эскалации. Если передача не состоялась — возникает блокировка потока.","actions":["Зафиксировать владельца передачи и получателя.","Установить SLA и критерии полноты результата.","При отклонении открывать блокировку и эскалацию."],"formula":"","owner":"","inputs":"","outputs":"","linked":["proc","blocked","methodology","flowowner"],"example":"Передача утверждённого сводного задания на стадию ЭП.","status":"Действует"},"quality":{"id":"quality","title":"Качество","group":"Качество и потери","brief":"Соответствие результата требованиям и критериям приёмки.","meaning":"Качество — отдельный показатель: оно не тождественно себестоимости. Брак увеличивает трудоёмкость и себестоимость через возвраты и снижает доступную мощность.","actions":["Определить критерии на входе и выходе подпроцесса.","Регистрировать отклонения и число циклов доработки.","Считать стоимость и время возврата."],"formula":"","owner":"","inputs":"","outputs":"","linked":["prod","rework","cost","methodology","efficiency"],"example":"КЭП ниже целевого ориентира, несовместимая квартирография или нарушение проектного стандарта.","status":"Действует"},"cost":{"id":"cost","title":"Себестоимость","group":"Качество и потери","brief":"Затраты на достижение принятого результата.","meaning":"Себестоимость нужно анализировать по материалам, работам, постоянным и переменным затратам; учитывать влияние КЭП, объёмов, возвращений и изменений. Минимальная себестоимость сама по себе не равна лучшему продукту.","actions":["Разделять материалы, работы и условно-постоянные затраты.","Пересчитывать стоимость при изменении архитектурных параметров.","Контролировать соответствие продукта целевой себестоимости."],"formula":"","owner":"","inputs":"","outputs":"","linked":["quality","rework","prod","efficiency"],"example":"Принцип продуктового решения: максимальная востребованность продукта при целевой себестоимости.","status":"Действует"},"rework":{"id":"rework","title":"Возврат","group":"События устойчивости","brief":"Повтор работ из-за несоответствия результата критерию качества.","meaning":"Возврат замкнут на производственный процесс, увеличивает трудоёмкость и снижает свободную мощность. Одновременно влияет на устойчивость системы и риск нарушения сроков.","actions":["Указывать причину и этап возврата.","Считать повторные трудозатраты и влияние на календарь.","Убирать корневую причину через пересборку стандарта или процесса."],"formula":"Mэфф ≈ Mбез потерь / (1 + доля повторной работы)","owner":"","inputs":"","outputs":"","linked":["quality","prod","loss","stability","diagnosis"],"example":"","status":"Действует"},"blocked":{"id":"blocked","title":"Блокировка","group":"События устойчивости","brief":"Остановка или задержка передачи результата между участниками.","meaning":"Блокировка — последствие разрыва взаимодействия. Она непосредственно создаёт простой, сужает пропускную способность и повышает риск разрыва потока.","actions":["Фиксировать заблокированный переход и ответственность.","Оценивать продолжительность простоя.","Эскалировать держателю потока и устранять причину."],"formula":"","owner":"","inputs":"","outputs":"","linked":["interaction","loss","stability","flowowner","diagnosis"],"example":"","status":"Действует"},"loss":{"id":"loss","title":"Узкие места и потери","group":"Качество и потери","brief":"Ограничители эффективной мощности потока.","meaning":"Сюда сходятся номинальная мощность, потери производственных процессов, возвраты, блокировки, ожидание и изменение условий. Слабейшая стадия ограничивает выпуск последовательной цепочки.","actions":["Измерять пропускную способность этапов.","Находить стадию с минимальной эффективной мощностью.","Подбирать изменение системы или ресурсов до устранения ограничения."],"formula":"Qрасч = min(Mэфф,₁ … Mэфф,ₙ)","owner":"","inputs":"","outputs":"","linked":["nom","rework","blocked","qcalc","strained"],"example":"","status":"Действует"},"qcalc":{"id":"qcalc","title":"Расчётная мощность","group":"Мощность и решения","brief":"Сколько результата реально способна обеспечить система.","meaning":"Учитывает эффективную мощность узких звеньев, календарь ресурсов, повторную работу, простои, ограничения и качество передачи результата.","actions":["Рассчитать мощность по каждому звену.","Проверить календарные пики по ролям.","Сравнить Qрасч с Qцель."],"formula":"Qрасч = min(Mэфф,₁ … Mэфф,ₙ)","owner":"","inputs":"","outputs":"","linked":["loss","comparison","stability","efficiency","operability","verification"],"example":"","status":"Действует"},"comparison":{"id":"comparison","title":"Сравнение мощностей","group":"Мощность и решения","brief":"Проверка достаточности производственного потенциала относительно цели.","meaning":"Если Qрасч ≥ Qцель — мощность достаточна для заданного объёма, но устойчивость дополнительно зависит от возвратов, блокировок, изменений и запаса. Иначе — дефицит и решение.","actions":["Вычислять абсолютный и относительный разрыв.","При дефиците выбрать вектор устранения.","После изменения вновь рассчитать мощность."],"formula":"ΔQ = Qрасч − Qцель","owner":"","inputs":"","outputs":"","linked":["qtarget","qcalc","sufficient","deficit","stability"],"example":"","status":"Действует"},"sufficient":{"id":"sufficient","title":"Мощности достаточно","group":"Мощность и решения","brief":"Расчётная мощность покрывает целевую программу.","meaning":"Это положительный результат сравнения, но не заключение об устойчивости всей системы. Нужно дополнительно проверить запас и воздействие среды.","actions":[],"formula":"","owner":"","inputs":"","outputs":"","linked":["comparison","stability"],"example":"","status":"Действует"},"deficit":{"id":"deficit","title":"Дефицит мощности","group":"Мощность и решения","brief":"Целевой объём превышает расчётную производительность системы.","meaning":"Два допустимых вектора реакции: пересборка самой системы либо увеличение штатной численности. Решения возвращаются в исходную модель и повторно проверяются по узким местам.","actions":["Вектор 1 — пересобрать функции, задачи, стандарты и процессы.","Вектор 2 — увеличить штат / изменить ресурсную мощность.","Проверить воздействие выбранного решения на новое узкое место."],"formula":"Дефицит = max(0, Qцель − Qрасч)","owner":"","inputs":"","outputs":"","linked":["comparison","redesign","staff","diagnosis"],"example":"","status":"Действует"},"redesign":{"id":"redesign","title":"Пересборка системы","group":"Мощность и решения","brief":"Структурное устранение потерь, причин дефицита или блокировки.","meaning":"Изменение функций, норм, содержания задач, последовательности подпроцессов, интерфейсов и стандартов. Цель — поднять эффективность, не обязательно увеличивая ресурсы.","actions":["Устранить лишние переходы и дублирующие задачи.","Стандартизировать повторяемые решения.","Изменить правила передачи и проверки качества.","Пересчитать трудоёмкость и мощность."],"formula":"","owner":"","inputs":"","outputs":"","linked":["deficit","functions","proc","labor","methodology","management"],"example":"","status":"Действует"},"staff":{"id":"staff","title":"Увеличение штатного расписания","group":"Мощность и решения","brief":"Количественное увеличение доступной ресурсной мощности.","meaning":"Дополнительные штатные единицы допустимы после определения трудоёмкости и узкого места. Рост численности звена, которое не ограничивает поток, не гарантирует роста общей мощности.","actions":["Определить должности и необходимые FTE по календарному пику.","Привязать новый ресурс к конкретным задачам.","Повторно рассчитать узкое место и сроки."],"formula":"Дополнительный FTE ≈ дефицит трудоёмкости / фонд одной ставки","owner":"","inputs":"","outputs":"","linked":["deficit","role","nom","management","deployment"],"example":"","status":"Действует"},"changes":{"id":"changes","title":"Изменения среды","group":"События устойчивости","brief":"Внешние воздействия, меняющие условия выполнения цели.","meaning":"Нормативные изменения, рынок, ресурсы, требования продукта и управленческие решения могут создавать новые работы и нарушать привычные процессы.","actions":["Фиксировать изменение и зону влияния.","Оценивать новый объём работ и узкое место.","Адаптировать систему до возникновения разрыва."],"formula":"","owner":"","inputs":"","outputs":"","linked":["stability","redesign","loss"],"example":"Изменение СП, местных нормативов, доступности материалов или продуктовых требований.","status":"Действует"},"stability":{"id":"stability","title":"Оценка устойчивости","group":"Устойчивость","brief":"Проверка способности системы сохранить поток под воздействием потерь и изменений.","meaning":"Сюда напрямую входят возвраты, блокировки, изменения среды и запас мощности. Устойчивая система компенсирует воздействия и сохраняет целевой объём, сроки и качество.","actions":["Проверить дефицит/запас мощностей.","Учесть изменение условий, возвраты и блокировки.","Зафиксировать последствия для потока и меру реакции."],"formula":"Условие устойчивости: Qэфф ≥ Qцель при соблюдении сроков и качества","owner":"","inputs":"","outputs":"","linked":["comparison","blocked","rework","changes","stable","rupture","strained","operability","verification"],"example":"","status":"Действует"},"stable":{"id":"stable","title":"Система устойчива","group":"Устойчивость","brief":"Поток сохраняется несмотря на воздействие среды.","meaning":"Есть компенсирующая способность, достаточная ресурсная и процессная пропускная способность и соблюдаются критерии качества и сроков.","actions":[],"formula":"","owner":"","inputs":"","outputs":"","linked":["stability"],"example":"","status":"Действует"},"rupture":{"id":"rupture","title":"Система неустойчива","group":"Устойчивость","brief":"Нагрузка/потери/изменения превышают способность системы компенсировать отклонения.","meaning":"Возникает разрыв потока, нарастает очередь незавершённых работ, и возникает риск срыва сроков либо целевого объёма. Управляющая обратная связь должна вести к пересборке системы или ресурсному решению.","actions":[],"formula":"","owner":"","inputs":"","outputs":"","linked":["stability","deadlines","redesign","staff","strained","diagnosis"],"example":"","status":"Действует"},"deadlines":{"id":"deadlines","title":"Срыв сроков и/или объёма","group":"Устойчивость","brief":"Внешнее проявление нарушения целевого результата.","meaning":"Срыв — следствие некомпенсированного разрыва потока; анализ должен идти к первопричинам в блокировках, возвратах, изменениях и ограничениях мощностей.","actions":[],"formula":"","owner":"","inputs":"","outputs":"","linked":["rupture","goal"],"example":"","status":"Действует"},"methodology":{"title":"Методология","group":"Процессы и поток","meaning":"Согласованные правила, стандарты, алгоритмы, критерии и способы выполнения работ. Методология регламентирует производственные процессы, взаимодействие, качество и трудоёмкость; изменение методологии — механизм пересборки системы.","brief":"Правила исполнения процессов и проверки результата","linked":["prod","interaction","quality","labor","redesign","efficiency","deployment"],"inputs":"Цели, ограничения, выявленные потери, опыт выполнения","outputs":"Алгоритмы, стандарты, критерии приёмки и нормы трудоёмкости","owner":"Держатель системы совместно с держателями процессов","actions":["Назначить держателя актуальности методологии.","Связать правило с задачами, процессами и критериями приёмки.","Проверять эффект изменённого правила на трудоёмкость и себестоимость."],"example":"Стандарт проверки КЭП и требований квартирографии на входе стадии ЭП.","id":"methodology","status":"На проработке","formula":""},"flowowner":{"title":"Держатель потока","group":"Процессы и поток","meaning":"Роль, отвечающая за сквозной результат, его срок и согласованность процессов, а не за локальные результаты подразделений. При возникновении блокировки организует устранение причины и отвечает за восстановление потока.","brief":"Единая ответственность за результат и срок","linked":["sub","proc","interaction","blocked","diagnosis"],"inputs":"Цель, правила передачи, показатели сквозного результата","outputs":"Управляемый поток и решения об устранении отклонений","owner":"Назначается на конкретный поток","actions":["Закрепить держателя потока и полномочия.","Фиксировать SLA передачи и критерии завершения.","Обеспечить эскалацию блокировок."],"example":"Поток Квартирография → Сводное задание → ЭП → Проверка эффективности.","id":"flowowner","status":"На проработке","formula":""},"efficiency":{"title":"Эффективность","group":"Качество и потери","meaning":"Соотношение полезного результата и затрат ресурсов. Рост производственного объёма или КЭП без оценки стоимости, качества и спроса не гарантирует повышение эффективности.","brief":"Результат на единицу совокупных затрат","linked":["cost","quality","qcalc","operability","methodology","actual","verification"],"inputs":"Результат, качество, себестоимость, затраченные часы","outputs":"Показатели эффективности и гипотезы оптимизации","owner":"Держатель системы и владельцы экономических показателей","formula":"Эффективность оценивается через результат / ресурсы. Конкретный KPI зависит от выбранной цели.","actions":["Сравнивать альтернативы при одинаковой функции и продуктовых требованиях.","Считать потери от возвратов и блокировок.","Проверять влияние оптимизации на себестоимость."],"example":"Повышение КЭП требует проверки стоимости конструкций и востребованности продукта.","id":"efficiency","status":"На проработке"},"strained":{"title":"Напряжённая","group":"Устойчивость","meaning":"Система пока выполняет план, но располагает малым резервом для компенсации возвратов, блокировок или изменения среды. Порог резерва — настраиваемый сценарный параметр, а не норматив.","brief":"Цель выполняется, запас мощности мал","linked":["stability","rupture","loss","diagnosis"],"inputs":"Расчётная мощность и целевой объём","outputs":"Сигнал об исчерпании резерва","owner":"Держатель потока","formula":"Резерв R=(Qрасч−Qцель)/Qцель ×100%.","actions":["Проверить глубину узких мест.","Сформировать план восстановления резерва."],"example":"Резерв 4% при согласованном пороге предупреждения 10%.","id":"strained","status":"На проработке"},"operability":{"title":"Работоспособность","group":"Управление и адаптация","meaning":"Сводная управленческая оценка: достаточность мощности, устойчивость к отклонениям и эффективность использования ресурсов. Не сводится к одному коэффициенту и проверяется по всем трём аспектам.","brief":"Мощность + устойчивость + эффективность","linked":["qcalc","stability","efficiency","verification"],"inputs":"Целевые и фактические показатели, ограничения, результаты диагностики","outputs":"Оценка способности достигать цели с требуемым качеством и себестоимостью","owner":"Держатель системы","actions":["Проверить выполнение целевого объёма.","Оценить запас прочности и потери.","Сопоставить фактическую себестоимость и качество с целевыми."],"example":"Мощности достаточно, но частые блокировки и высокий повторный труд требуют пересборки процесса.","id":"operability","status":"На проработке","formula":""},"diagnosis":{"title":"Диагностика причины","group":"Управление и адаптация","meaning":"При дефиците мощности, блокировке, возвратах или нарушении срока сначала выяснить первопричину: методология, процесс, взаимодействие, трудоёмкость либо недостаток ресурсов.","brief":"Отклонение → первопричина, без преждевременного найма","linked":["deficit","rupture","blocked","rework","management","flowowner","strained","actual","verification"],"inputs":"События, показатели, динамика потока, фактическая трудоёмкость","outputs":"Подтверждённая гипотеза первопричины и вариант решения","owner":"Держатель системы совместно с держателем потока","actions":["Отделить нехватку ресурсов от потерь процесса.","Сопоставить факт с расчётной моделью.","Зафиксировать первопричину, ответственного и срок."],"example":"Блокировка из-за неполноты входных данных не устраняется расширением штата исполнителей.","id":"diagnosis","status":"На проработке","formula":""},"management":{"title":"Решение об изменении","group":"Управление и адаптация","meaning":"Два базовых вектора: пересборка системы (методология, задачи, взаимодействия, процессы, структура) либо увеличение штатного расписания. До выбора оцениваются причина, затраты и ожидаемый результат.","brief":"Пересборка или увеличение штата","linked":["diagnosis","redesign","staff","deployment"],"inputs":"Диагноз, ограничения, альтернативы, оценка эффекта","outputs":"Выбранная гипотеза, согласование и план","owner":"Держатель системы, руководитель затрагиваемого подразделения","actions":["Оценить пересборку до увеличения штата.","Согласовать изменение с руководителем затрагиваемого подразделения.","Зафиксировать срок и ожидаемый показатель."],"example":"Упрощение передачи исходных данных вместо дополнительного проверяющего.","id":"management","status":"На проработке","formula":""},"deployment":{"title":"Внедрение решения","group":"Управление и адаптация","meaning":"Согласованное изменение переводится в задачи, назначенных исполнителей, сроки и обновлённые регламенты. Завершение подтверждается фактом изменения рабочего процесса.","brief":"Решение → задачи → ответственные → сроки","linked":["management","methodology","staff","actual"],"inputs":"Согласованное решение и ресурсный план","outputs":"Работающее изменение структуры, процесса или ресурса","owner":"Назначенный держатель изменения","actions":["Определить владельца, срок и критерий внедрения.","Внести изменения в реестр задач и правила.","Проверить факт внедрения."],"example":"Изменение SLA передачи ЭП и обязательного состава входных данных.","id":"deployment","status":"На проработке","formula":""},"actual":{"title":"Фактические показатели","group":"Управление и адаптация","meaning":"План и фактический объём, часы, сроки, стоимость, частота возвратов и длительность блокировок. Незаданные значения считаются неизвестными, а не нулём.","brief":"План / факт и наблюдение потерь","linked":["deployment","verification","efficiency","diagnosis"],"inputs":"Реальный учёт результатов и затрат","outputs":"Данные для повторной оценки и совершенствования модели","owner":"Держатели процессов и аналитик системы","actions":["Сверять целевой и фактический выпуск.","Фиксировать причины потерь и фактическую трудоёмкость.","Не подменять отсутствующий факт прогнозом."],"example":"Фактические часы на 1000 м² против модельной нормы.","id":"actual","status":"На проработке","formula":""},"verification":{"title":"Повторная проверка","group":"Управление и адаптация","meaning":"После внедрения повторно проверить расчётную мощность, устойчивость и эффективность. Если цель не достигается, вернуться к диагностике и сформировать новую гипотезу.","brief":"Проверить эффект и замкнуть обратную связь","linked":["actual","qcalc","stability","efficiency","operability","diagnosis"],"inputs":"Фактические показатели, целевой объём, новые ограничения","outputs":"Решение: эффект подтверждён / нужна следующая итерация","owner":"Держатель системы","actions":["Пересчитать мощность с новыми параметрами.","Проверить резерв и устойчивость к отклонениям.","Зафиксировать фактический экономический эффект."],"example":"После пересборки процесса мощность возросла, но анализ блокировок показывает новый узкий участок.","id":"verification","status":"На проработке","formula":""}},"knowledge":[{"id":"principles","category":"Методология","title":"7 системных принципов","intro":"Логика построения архитектурно-проектной системы.","body":["Систему проектируют от цели и требуемого результата, а не от текущей загрузки отделов.","Базовая цепочка: цель → поток создания ценности → функции → задачи → роли → трудоёмкость → мощность → штат.","Функциональная модель порождает потери на стыках; держатель потока отвечает за сквозной результат и срок.","Каждая задача имеет измеримый выход, исполнителя и связь с подпроцессом.","Производственные процессы и процессы взаимодействия — самостоятельные, но взаимосвязанные компоненты.","Возврат, блокировка и изменение среды влияют на мощность и устойчивость.","После пересборки системы или увеличения штата выполняется повторный расчёт."],"tags":["цель","роль","процесс","архитектура"]},{"id":"holders","category":"Управление","title":"Держатель системы и держатель потока","intro":"Разделение архитектуры системы и ответственности за фактический результат.","body":["Держатель системы поддерживает её целостность, цели, принципы, структуру и критерии изменений.","Держатель потока управляет сквозным созданием результата: от входа до приёмки, включая сроки, качество, блокировки и эскалацию.","Руководитель подразделения управляет доступностью сотрудников, компетенциями, назначениями и ресурсом.","Исполнитель отвечает за результат закреплённой задачи.","Сотрудники влияют на систему через выявление проблем, вопросы, предложения, проверку гипотез и развитие правил."],"tags":["держатель","роль","руководитель"]},{"id":"pipeline","category":"Процессы","title":"Ядро потока проектирования","intro":"Зафиксированная последовательность основных подпроцессов.","body":["Квартирография: разработка состава, площадей и профиля квартир относительно класса и продукта.","Сводное задание: согласованный набор исходных требований для проектирования.","Эскизный проект (ЭП): архитектурно-планировочное решение и подтверждение ключевых параметров.","Проверка архитектурной эффективности: КЭП, квартирный профиль, ограничения площади, стандарты и себестоимость.","Внутренние подпроцессы Платформы: развитие архитектурной эффективности, оптимизация, стандартизация и систематизация."],"tags":["квартирография","эп","проверка","поток"]},{"id":"task","category":"Процессы","title":"Атрибутивная модель задачи","intro":"Минимальный состав карточки для управляемой задачи.","body":["Название и назначение; исходные данные и единица результата.","Роль-исполнитель, держатель подпроцесса, причастные стороны.","Трудоёмкость на единицу (РД/ед или ч/ед) и связь с целевой производственной программой.","Критерии приемки, статус, SLA передачи, взаимосвязи, риски и история изменений.","При переходе к расчёту штата учитывать одновременные работы на разных объектах и стадиях."],"tags":["задачи","исполнители","трудоёмкость"]},{"id":"capacity","category":"Расчёты","title":"Математика мощности и штатной потребности","intro":"Расчёт ведётся от единицы работы до календарного пика.","body":["Трудоёмкость цели: H = Σ(Nᵢ × Tᵢ), где Nᵢ — количество задач, Tᵢ — трудоёмкость одной.","Потребность в ставках: FTE = H / M, где M — эффективный фонд одной ставки за период.","Для последовательного потока Qрасч = min(Q₁…Qₙ), где Qᵢ — фактические мощности звеньев.","Простой, возврат и изменения нужно учитывать отдельно, чтобы избежать двойного счёта.","Средняя загрузка не заменяет пиковую: персонал планируют с учётом одновременности проектов."],"tags":["fte","расчёт","мощность","формула"]},{"id":"calendar","category":"Расчёты","title":"Декомпозиция производственной программы","intro":"Мост от целевого ввода к параллельным задачам и ресурсам.","body":["Целевой ввод: 130 000 м²/год с 2029 года, с дальнейшим увеличением на 5 000 м²/год.","Длительность строительства как базовый сценарий — 2 года; требуемый объём в реализации при ровном вводе порядка 260 000 м².","Типовой объект для укрупнённой декомпозиции — 40 000 м².","Логика: трудоёмкость на единицу → программа работ по годам и стадиям → трудоёмкость на цель → календарная загрузка → штат → проверка мощности и сроков.","РД считать на единицу, далее масштабировать на программу, затем распределять по ролям и месяцам."],"tags":["130000","ввод","календарь","цель"]},{"id":"resilience","category":"Устойчивость","title":"Контур устойчивости и компенсирующая способность","intro":"Непосредственные связи: блокировки, изменения среды, возвраты и запас мощности.","body":["Блокировка — недоступность входа/результата из-за разрыва взаимодействия.","Возврат — повторная работа вследствие невыполнения требований качества.","Изменения — дополнительные работы или ограничения от внешней среды.","Неустойчивость проявляется разрывом потока: срыв сроков, объёма либо качества.","Контроль устойчивости связан с расчётом узкого места и обратной связью: пересборка системы либо дополнительный ресурс."],"tags":["устойчивость","блокировка","возврат","срок"]},{"id":"changes","category":"Управление","title":"Управление изменениями элементов системы","intro":"Изменения должны проходить проверку причин и последствий.","body":["Инициатор формулирует вопрос, наблюдение, гипотезу или проблему.","Определяются изменяемые функции, задачи, роли и процессы; оценивается воздействие на трудоёмкость, мощность и качество.","Ответственный согласует решение с держателем системы / потока согласно масштабу влияния.","После внедрения выполняется расчёт, проверяется фактический эффект и обновляется связанная документация.","Статусы: Гипотеза → На проработке → Действует; при устаревании — Требует пересмотра."],"tags":["изменение","статус","вопрос"]},{"id":"quality","category":"Качество и стоимость","title":"Качество, возвраты, себестоимость","intro":"Брак расходует ресурсы и не создаёт новый полезный результат.","body":["На каждом переходе между подпроцессами должны быть критерии качества результата.","При несоответствии фиксируются возврат, причина, дополнительная трудоёмкость, срок исправления и владелец решения.","Себестоимость нужно раскладывать по работам, материалам и постоянным составляющим; масштаб проектов существенно влияет на ₽/м².","Конечная продуктовая цель: не максимальная комплектация при минимальной себестоимости, а максимальная востребованность при целевой себестоимости."],"tags":["качество","стоимость","потери"]},{"id":"kep","category":"Архитектурная эффективность","title":"КЭП: определение и проверка","intro":"Базовая метрика продаваемости типового этажа.","body":["КЭП = S квартир типового этажа (с лоджиями, без балконов) / S строительная по наружной грани ограждений.","Из знаменателя исключаются лифтовые шахты и балконы согласно принятой рабочей методологии.","КЭП — метрика использования площади, но не единственный показатель результата: сочетать с качеством продукта и себестоимостью.","Ниже целевого КЭП искать причины: геометрия, коридоры, вертикальные коммуникации, состав квартир, особенности конструкции."],"tags":["кэп","площадь","геометрия"]},{"id":"types","category":"Архитектурная эффективность","title":"Т-тип и Н-тип: правила сравнения","intro":"Сравнивать при одном целевом ТЭП, программе и ограничениях.","body":["Т-тип: ориентир КЭП ≈0,71–0,74; около 14 квартир на типовом этаже; Sстр ≈740 м²; Sпрод ≈535 м².","Н-тип: ориентир КЭП ≈0,67–0,73; 16–18 квартир; Sпрод примерно 600–650 м².","При средней площади квартиры 39–45 м² и 14–16 кв./эт Т-тип часто эффективнее по КЭП.","При Sэт больше 600–650 м² и Sср выше 45 м² Н-тип может выигрывать этажностью.","При смещении состава к студиям Н-тип способен стать эффективнее на средних площадях."],"tags":["т-тип","н-тип","кэп"]},{"id":"classes","category":"Архитектурная эффективность","title":"Профиль квартир и классификация","intro":"Последние принятые рабочие диапазоны и целевой состав.","body":["Классы квартир по средним размерам: нС <31; С 31–38; С/К 38–39; К 39–43; К/К+ 43–44; К+ 44–50; К+/Б 50–53; Б >53 м².","Минимум 1С — 20 м²; атрибутивная модель Стандарт для 1С: min 22, opt 23, max 24 м².","Типовой целевой профиль: 1С 22–28%; 1К+2С 42–52%; 2К+3С 18–28%; 3К+ 5–12%.","Проверять требования продуктового сегмента, рыночной востребованности и ограничений матрицы."],"tags":["квартирография","классы","1с"]},{"id":"vodyanaya","category":"Практика и кейсы","title":"Водяная (Томск): сравнение Т/Н","intro":"Пример оптимизации по равному ТЭП.","body":["Условия: 2 секции, максимум 25 этажей, ТЭП около 24 000 м² ±3%, класс Стандарт.","Т-тип «Феникс»: 14 кв./эт; Sпрод 535,5; КЭП 0,723; Sстр 740; этажность 25 + 18–19; ТЭП 23 562; Sср 38,3.","Н-тип: 17 кв./эт; Sпрод 654,7; КЭП 0,696; этажность 19 + 17; ТЭП 23 568; Sср 38,5.","При равном ТЭП Т-тип лучше по КЭП для Sср около 38–39. Для роста до КЭП 0,740 Т-типу нужно примерно +12,1 м² квартир на этаж."],"tags":["водяная","томск","кэп"]},{"id":"basil","category":"Практика и кейсы","title":"Базилик: влияние масштаба на себестоимость","intro":"Не путать строительную эффективность с эффектом условно-постоянных затрат.","body":["Себестоимость: дом 1 — 81 828 ₽/м²; дом 2 — 89 787 ₽/м².","При одинаковых расценках дом 2 — около 81 642 ₽/м².","Разница фактической себестоимости во многом объясняется объёмом и распределением условно-постоянных затрат; оценку КЭП нельзя отождествлять с изменением общей себестоимости."],"tags":["базилик","себестоимость","объём"]},{"id":"walls","category":"Качество и стоимость","title":"Материалы и конструкции: текущая база","intro":"Рабочие исходные ставки, подлежащие актуализации по объекту и дате.","body":["Рядовой кирпич: 20 ₽/шт; облицовочный кирпич: 40 ₽/шт; MAGIS 390×190×188: 110 ₽/шт; СППо: 850 ₽/м².","Типовая трёхслойная ограждающая стена: 250+150+120 мм. Межквартирная: кирпич 250 мм или 120 кирпич +20 штукатурка +40 зазор +ПГП 80.","Последний набор объёмов примера: трёхслойная стена 70 м², облицовка 45 м², кирпич 250 мм без утепления 36 м².","Для смет отдельно учитывать материалы и работы; не подставлять данные как официальные нормативные цены."],"tags":["материалы","кирпич","стены","смета"]},{"id":"website","category":"Инструменты","title":"Сайт как инструмент управления системой","intro":"Схема, данные, расчёты и предложения сотрудников — единая рабочая среда.","body":["Режим «Система» — общая структура и причинно-следственные связи.","Режим «Поток» — последовательность работ и статусы подпроцессов.","Режим «Структура» — связь задач, должностей, трудоёмкости и ответственности.","«Мощность» и «Устойчивость» — расчёты, моделирование и поиск ограничений.","Карточки содержат описание, владельца, статус, связи, примеры и рабочие заметки.","Редактирование сохраняется локально в браузере; экспорт JSON нужен для передачи и версионирования."],"tags":["сайт","инструкция","инструмент"]},{"id":"maturity","category":"Устойчивость","title":"Стадии зрелости системы","intro":"Путь от неуправляемой деятельности к саморазвитию.","body":["Хаос → Управление потоком → Определённость → Стандартизация → Цифровая система → Саморазвитие.","Защитные слои устойчивости строятся вокруг сквозного потока; инструменты не заменяют управление результатом.","Для каждой ступени важна проверка фактического поведения: способность выявить риск, компенсировать потери и сохранить качество/срок."],"tags":["зрелость","устойчивость"]},{"id":"projectnet","category":"Инструменты","title":"ПроектСеть и калькулятор КЭП","intro":"Публичный канал развития архитектурной эффективности.","body":["ШАГ 0 — публичный калькулятор КЭП: https://proektset.github.io/KEP/.","Базовые поля: Sстр, Sкв, тип Н/Т, класс, количество квартир и средняя площадь.","Результаты: КЭП, разрыв до 0,740, предупреждение о значении ниже целевого минимума и рекомендации.","Функции: счётчик объектов, видео, заявка «Отправить на проверку» на proektset@mail.ru."],"tags":["проектсеть","кэп","калькулятор"]},{"id":"system_definition","category":"Методология","title":"Определение системы","intro":"Цель, взаимосвязи, ограничения и адаптация.","body":["Система — совокупность взаимосвязанных элементов, организованных для достижения цели в заданных ограничениях и способных адаптироваться к изменениям среды.","Цель определяет требуемый объём; структура определяет ресурсы; процессы создают результат; методология задаёт правила; обратная связь меняет способ работы.","Работоспособность оценивается по мощности, устойчивости и эффективности."],"tags":["система","определение","цель"]},{"id":"methodology_rules","category":"Методология","title":"Методология управления процессом","intro":"Правила работы и основания изменения.","body":["Методология устанавливает алгоритмы работы, нормы, способы проверки и передачи результата.","К каждому правилу привязываются функции, задачи, процесс, держатель и критерий качества.","Изменение методологии требует оценки влияния на трудоёмкость, себестоимость, качество и устойчивость."],"tags":["методология","процесс","стандарты"]},{"id":"adaptation","category":"Управление","title":"Контур управления и адаптации","intro":"Отклонение → причина → решение → внедрение → проверка.","body":["Отклонение фиксируется на уровне процесса или потока; причины проверяются по факту, а не по предположению.","Два базовых вектора решения: пересборка системы и увеличение штатного расписания.","Любое решение требует исполнителя, срока, критериев принятия и повторного расчёта мощности и устойчивости.","Изменения методологии, ролей и процессов фиксируются с историей."],"tags":["диагностика","изменение","обратная связь"]},{"id":"resilience3","category":"Устойчивость","title":"Три состояния устойчивости","intro":"Устойчива, напряжена, неустойчива.","body":["Устойчива: есть запас и возможность компенсировать допустимые воздействия без нарушения цели.","Напряжена: план выполняется, однако резерв ниже выбранного порога.","Неустойчива: воздействие приводит к нарушениям объёма, качества или срока.","Порог резерва — управленческий сценарный параметр, не нормативная величина. Для окончательного вывода нужны наблюдения блокировок, восстановления и качества."],"tags":["запас мощности","возвраты","блокировки"]},{"id":"operability3","category":"Управление","title":"Мощность, устойчивость, эффективность","intro":"Три взаимосвязанные, но не тождественные характеристики.","body":["Мощность: сколько система может произвести за период.","Устойчивость: сохраняет ли результат при отклонениях и меняющихся ограничениях.","Эффективность: какого результата система достигает на единицу ресурсов.","Работоспособность рассматривается по совокупности характеристик, не по одному КЭП или коэффициенту мощности."],"tags":["работоспособность","эффективность","срок"]},{"id":"cause_map","category":"Управление","title":"Причины и последствия отклонений","intro":"Динамика возвратов, блокировок и изменений среды.","body":["Возврат: доработка → дополнительные часы → снижение свободного резерва мощности → риск нарушения объёма и срока.","Блокировка: ожидание передачи → простой → накопление очереди → ограничение пропускной способности.","Изменение среды: новые нормы или ограничения → проверка применимости методологии → пересборка работ либо ресурсов.","События не равнозначны неустойчивости: важна способность системы компенсировать их."],"tags":["причины","последствия","потери"]},{"id":"integrity","category":"Управление","title":"Проверка полноты системы","intro":"Реестры и связи должны быть непротиворечивыми.","body":["Функция раскрыта до задач; у задачи есть исполнитель и процессная принадлежность.","Подпроцесс имеет держателя, результат и критерии приёмки; переход имеет ответственного и условия передачи.","Нормы трудоёмкости должны быть явно заполнены, иначе численный расчёт штата по реестру не подтверждён.","Реестры перенесены из сохранённой версии, поэтому до использования необходима сверка с текущей оргструктурой."],"tags":["контроль","полнота","реестры"]},{"id":"actuals","category":"Управление","title":"Фактические показатели и история","intro":"Проверяем не только модель, но и результат внедрения.","body":["Факт: объём, трудоёмкость, срок, стоимость, возвраты, блокировки.","Для каждого изменения фиксируются причина, владелец, ожидаемый эффект и подтверждённый результат.","Незаполненное значение не приравнивается к нулю; отдельный сценарий моделирования не является фактом.","Локальный журнал в браузере не заменяет централизованную версионируемую базу."],"tags":["план факт","история","метрики"]}],"flow":[{"id":"flow-apt","title":"Квартирография","desc":"Состав квартир, средняя площадь, продуктовый профиль, минимумы, оптимумы и ограничения класса.","inputs":"Класс, продуктовая гипотеза, цель по ТЭП, рыночный профиль","outputs":"Согласованный квартирный профиль и исходные данные для СЗ","owner":"Платформа / держатель потока","status":"Действует","related":"classes"},{"id":"flow-assignment","title":"Сводное задание","desc":"Формал  if(!demoState.active)return;
 if(demoState.scope!=='all'){
  let i=DEMO_CHAPTERS.findIndex(x=>x.id===demoState.scope);

 <div class="org-guide-content">
 <div class="org-guide-lead">Объединяем Платформу и ИПР не ради организационной схемы, а ради единого потока создания ценности: продукт заданного качества, эффективности и себестоимости в установленный срок.</div>
 <h4>01 · Потери на границах ответственности</h4>
 <p>Чем больше взаимозависимых функций распределено между подразделениями с самостоятельными приоритетами, тем больше потенциальных зон ответственности, согласований и передач. Это повышает <b>риск</b> ожидания, возвратов и блокировок, а значит — снижения эффективной мощности и разрыва потока.</p>
 <div class="org-guide-steps">
  <div class="org-guide-step"><strong>Локальные цели и независимые центры решений</strong><span>Разные приоритеты, критерии готовности и календари.</span></div>
  <div class="org-guide-step"><strong>Организационные стыки</strong><span>Передачи, согласования, ожидание и неясность полномочий.</span></div>
  <div class="org-guide-step"><strong>Возвраты / блокировки / повторные работы</strong><span>Потери времени и трудоёмкости уменьшают полезную пропускную способность.</span></div>
  <div class="org-guide-step"><strong>Риск разрыва потока</strong><span>Каждое подразделение выполнило локальную задачу, но целевой результат системы не достигнут.</span></div>
 </div>
 <div class="org-guide-note"><b>Уточнение:</b> число подразделений само по себе не определяет число возвратов. Потери зависят от качества передач, взаимозависимости функций, единых критериев и управляемости. Уменьшаем не просто подразделения, а число <b>неуправляемых организационных границ</b>.</div>
 <h4>02 · Меняем фокус: задача подразделения → результат потока</h4>
 <div class="org-guide-table-wrap"><table class="org-guide-table"><thead><tr><th>Функциональная модель</th><th>Поточная модель</th></tr></thead><tbody>
  <tr><td>Выполнить и передать свою задачу.</td><td>Обеспечить пригодный результат следующей стадии.</td></tr>
  <tr><td>Оптимизировать загрузку своего подразделения.</td><td>Оптимизировать сквозной срок, потери и трудоёмкость.</td></tr>
  <tr><td>Успех = локальные KPI.</td><td>Успех = продукт, качество, себестоимость и срок.</td></tr>
  <tr><td>Ответственность по границе функции.</td><td>Один держатель отвечает за сквозной результат и устранение блокировок.</td></tr>
 </tbody></table></div>
 <p>Например, Платформа может улучшить КЭП ценой поздних переделок и срыва срока; ИПР может выпустить документацию вовремя, но не обеспечить целевую себестоимость. Оба локальных результата не эквивалентны успешности системы.</p>
 <h4>03 · Что объединяем, а что сохраняем</h4>
 <div class="org-guide-table-wrap"><table class="org-guide-table">
 <thead><tr><th>Компетенция</th><th>Сохраняемая ответственность</th></tr></thead><tbody>
 <tr><td><b>Платформа</b></td><td>Атрибутивная модель квартир, стандарты, типовые решения, оптимизация, методология, проверка архитектурной эффективности и целевой себестоимости.</td></tr>
 <tr><td><b>ИПР</b></td><td>Организация проектирования, междисциплинарная координация, ресурсы и график стадий, разработка и комплектность проектных решений.</td></tr>
 <tr><td><b>Общее управление</b></td><td>Одна цель, приоритеты, календарь ресурсов, критерии приёмки, маршрут решений, обратная связь по качеству и стоимости.</td></tr>
 </tbody></table></div>
 <div class="org-guide-note"><b>Важно:</b> административное объединение само по себе не создаёт поток. Эффект дают единые критерии результата, назначенный держатель, обязательные точки контроля и полномочия устранять блокировки. Компетенции и независимую проверку качества необходимо сохранить.</div>
 <h4>04 · Как работает единый поток</h4>
 <div class="org-guide-steps">
 <div class="org-guide-step"><strong>01 · Цель и параметры продукта</strong><span>Продаваемая площадь, квартирный профиль, целевой КЭП, себестоимость, сроки, ограничения объекта.</span></div>
 <div class="org-guide-step"><strong>02 · Квартирография и сводное задание</strong><span>Платформа формирует параметры и ограничения; совместно с ИПР фиксируются критерии приёмки, исходные данные и допустимые отклонения.</span></div>
 <div class="org-guide-step"><strong>03 · Эскизный проект и координация</strong><span>ИПР организует проектирование; Платформа сопровождает решения и проверяет эффективность до закрепления дорогих решений.</span></div>
 <div class="org-guide-step"><strong>04 · Проверка архитектурной эффективности</strong><span>Единая контрольная точка: продукт, КЭП, расчётная себестоимость, качество, срок. Несоответствие означает решение об изменении или обоснованное согласование отклонения — не молчаливую передачу дальше.</span></div>
 <div class="org-guide-step"><strong>05 · Дальнейшая проектная стадия</strong><span>Только согласованное решение передаётся в дальнейшее проектирование. Изменение после передачи фиксируется с влиянием на сроки, трудоёмкость и стоимость.</span></div>
 </div>
 <h4>05 · Управление и контроль</h4>
 <ul>
 <li><b>Единое производственное задание:</b> целевые параметры и критерии завершения по каждой стадии.</li>
 <li><b>Единый календарь:</b> фактическая загрузка проектировщиков и экспертов Платформы по объектам и стадиям.</li>
 <li><b>Один журнал отклонений:</b> блокировки, возвраты, пересогласования, решения и их влияние на срок.</li>
 <li><b>Проверка результата:</b> достижение КЭП в привязке к себестоимости, качеству продукта и сроку, а не максимизация КЭП любой ценой.</li>
 </ul>
 <h4>06 · Критерий успеха объединения</h4>
 <p>Проект проходит контрольные точки в срок, с целевой себестоимостью и продуктом нужного качества, без необоснованных возвратов. Локальные показатели подразделений подчинены сквозному результату. Измеряются длительность передач, блокировки, повторная работа и стабильность качества.</p>
 <div class="org-guide-note"><b>Два системных принципа:</b> (1) структура проектируется под поток, а не поток под существующую структуру; (2) успешность функции определяется вкладом в общий результат, а не исключительно числом закрытых задач.</div>

 <div class="org-guide-content">
 <div class="org-guide-lead">Держатель потока — персонально назначенный ответственный за сквозной результат. Методологически предпочтителен независимый от подразделений РП; фактически роль должна быть поручена тому, кто способен управлять потоком в существующей структуре — с достаточными правами, компетенциями и мощностью.</div>
 <h4>01 · Независимость или реальная управленческая сила?</h4>
 <div class="org-guide-table-wrap"><table class="org-guide-table"><thead><tr><th>Модель</th><th>Сильная сторона</th><th>Ограничение</th></tr></thead><tbody>

  <tr><td><b>Сильный руководитель действующей структуры</b></td><td>Имеет доступ к исполнителям и реальный управленческий авторитет.</td><td>Риск приоритета своей функции; нужен единый мандат на результат.</td></tr>
 </tbody></table></div>
 <div class="org-guide-note"><b>Вывод:</b> нахождение вне подразделения — методологически полезно, но не является обязательным условием. Критерий эффективности — реальная способность обеспечить сквозной результат.</div>
 <h4>02 · Три уровня держателей: не смешивать ответственность</h4>
 <div class="org-guide-table-wrap"><table class="org-guide-table"><thead><tr><th>Роль</th><th>За что отвечает</th><th>Кто может исполнить</th></tr></thead><tbody>
  <tr><td><b>Держатель системы</b></td><td>Общая цель, архитектура процессов, методология, распределение ресурсов и мощность.</td><td>Руководитель единой дирекции / иной руководитель с общим мандатом.</td></tr>
  <tr><td><b>Держатель типового процесса</b></td><td>Стандарт сквозного процесса для всех объектов, SLA передач, повторяющиеся потери, развитие методологии.</td><td>Назначенный процессный руководитель с межфункциональными полномочиями.</td></tr>
  <tr><td><b>Держатель объектного потока</b></td><td>Результат и сроки стадий конкретного объекта, качество, блокировки и эскалация.</td><td>РП / ГИП ТЗ / действующий руководитель с реальными полномочиями.</td></tr>
  <tr><td><b>Руководитель подразделения</b></td><td>Ресурсы и профессиональные компетенции сотрудников.</td><td>Руководитель соответствующей функции.</td></tr>
  <tr><td><b>Исполнитель</b></td><td>Завершение конкретной задачи по критериям приёмки.</td><td>Назначенный специалист.</td></tr>
 </tbody></table></div>
 <p>РП отвечает за объект, но не обязательно вправе изменить общий типовой процесс для всех объектов. Это задача держателя типового процесса. На каждом уровне назначается <b>один</b> ответственный; совмещение ролей допустимо только при достаточной мощности.</p>
 <h4>03 · Кандидаты на роль и условия назначения</h4>
 <div class="org-guide-table-wrap"><table class="org-guide-table">
 <thead><tr><th>Кандидат</th><th>Сильная сторона</th><th>Ограничение и применение</th></tr></thead><tbody>
 <tr><td><b>Независимый РП</b></td><td>Ориентирован на сквозной объектный результат.</td><td>Предпочтителен в целевой методологической модели при наличии реальных полномочий и доступа к ресурсам.</td></tr>
 <tr><td><b>ГИП ТЗ / технический руководитель проекта</b></td><td>Видит технические зависимости стадий и смежных разделов.</td><td>Подходит для объектного потока, когда способен управлять приоритетами и качеством передач.</td></tr>
 <tr><td><b>Руководитель ИПР / руководитель проектирования</b></td><td>Управляет исполнением и проектными ресурсами.</td><td>Подходит при прямом влиянии на Платформу и критерии эффективности; иначе будет отвечать лишь за выпуск.</td></tr>
 <tr><td><b>Руководитель Платформы</b></td><td>Сильная компетенция в продукте, КЭП и себестоимости.</td><td>Подходит для раннего подпотока эффективности, но без полномочий по проектированию не обеспечивает весь цикл.</td></tr>
 <tr><td><b>Руководитель единой дирекции</b></td><td>Права на распределение ресурсов и изменение правил.</td><td>Оптимален как держатель <b>системы</b> и уровень эскалации; постоянное ведение каждого объектного потока перегрузит роль.</td></tr>
 <tr><td><b>Совместное владение / комитет</b></td><td>Объединяет экспертизу и обсуждение сложных решений.</td><td>Не рекомендуется как персональная ответственность: при срыве трудно определить, кто восстанавливает поток.</td></tr>
 </tbody></table></div>
 <h4>04 · Распределение ответственности без создания лишних единиц</h4>
 <div class="org-guide-steps">
 <div class="org-guide-step"><strong>Держатель системы · руководитель объединённой дирекции</strong><span>Назначает держателей потоков, утверждает стандарты и распределение ресурсов, разрешает конфликты полномочий.</span></div>
 <div class="org-guide-step"><strong>Держатель типового процесса · назначенный руководитель процесса</strong><span>Проектирует стандарт, управляет изменениями правил, повторяющимися потерями и SLA по всем объектам.</span></div>
 <div class="org-guide-step"><strong>Держатель объектного потока · РП / ГИП ТЗ / иной кандидат</strong><span>Управляет прохождением конкретного объекта и восстановлением потока. Назначается по фактической способности, а не названию должности.</span></div>
 <div class="org-guide-step"><strong>Ответственные за подпроцессы · профильные руководители и специалисты</strong><span>Создают результаты стадий и передают их по утверждённым критериям, фиксируют проблемы и трудоёмкость.</span></div>
 </div>
 <h4>05 · Редизайн: сначала функции и роли, затем штат</h4>
 <div class="org-guide-steps">
  <div class="org-guide-step"><strong>1 · Цель и модель потока</strong><span>Определить сквозной результат, стадии, необходимые функции и критерии качества, срока и себестоимости.</span></div>
  <div class="org-guide-step"><strong>2 · Карта действующей системы</strong><span>Найти дубли, зоны неопределённости, возвраты, блокировки и фактические центры принятия решений.</span></div>
  <div class="org-guide-step"><strong>3 · Аудит силы структурных единиц</strong><span>Проверить полномочия, компетенции, авторитет, доступ к исполнителям и свободную мощность кандидатов.</span></div>
  <div class="org-guide-step"><strong>4 · Перераспределение ролей, функций и прав</strong><span>В первую очередь использовать существующую структуру, устранить лишние стыки и закрепить персональную ответственность.</span></div>
  <div class="org-guide-step"><strong>5 · Проверка на реальных объектах</strong><span>Оценить загрузку по стадиям, сроки, потери, качество и устойчивость. Наличие сильного руководителя ещё не означает свободного времени.</span></div>
  <div class="org-guide-step"><strong>6 · Новые роли и штат — только при подтверждённом дефиците</strong><span>Если перераспределение не обеспечивает нужную мощность и компетенции, обосновать структурные изменения или дополнительные единицы.</span></div>
 </div>
 <div class="org-guide-note"><b>Правило:</b> нельзя создавать новую должность для решения проблемы, причина которой — неправильное распределение ответственности. Но перераспределять задачи без проверки нагрузки также нельзя: скрытая перегрузка создаст новое узкое место.</div>
 <h4>06 · Какие полномочия необходимы</h4>
 <ul>
 <li>Видеть цель, реальную загрузку, статус каждой стадии, причины отклонений и связанные затраты.</li>
 <li>Требовать соблюдения входных данных, критериев приёмки и сроков передачи (SLA).</li>
 <li>Инициировать изменение последовательности работ и приоритетов в пределах согласованных прав.</li>
 <li>Останавливать некорректную передачу результата, назначать корректирующие действия и выносить конфликт на руководителя системы.</li>
 <li>Получать решение о ресурсах и изменении методологии через установленные механизмы; не подменять собой руководителей подразделений.</li>
 </ul>
 <h4>07 · Как измерять результат держателя</h4>
 <ul>
 <li><b>Срок:</b> прохождение контрольных точек и отклонение от согласованного календаря.</li>
 <li><b>Качество:</b> доля приёмок с первого предъявления и число возвратов.</li>
 <li><b>Эффективность:</b> достижение целевого КЭП и целевой себестоимости при сохранении характеристик продукта.</li>
 <li><b>Устойчивость:</b> длительность блокировок и восстановление потока после отклонений.</li>
 </ul>
 <div class="org-guide-note"><b>Проверка назначения:</b> если человек отвечает за сквозной срок, но не может влиять на передачу результатов, приоритеты и эскалацию, он фактически координатор, а не держатель потока. Права и KPI должны соответствовать ответственности.</div>
 <div class="org-guide-lead"><b>Системный принцип:</b> роль проектируется от потребности потока, но назначается с учётом реальной способности существующей структуры её исполнить. Сначала перераспределяются функции и полномочия, затем проверяется мощность — и лишь потом решается вопрос о новых единицах.</div>
 <div class="org-guide-note"><b>Рабочая рекомендация:</b> независимый РП — методологический ориентир, а наиболее способный действующий руководитель — возможный переходный держатель. Конкретное назначение и его мандат устанавливаются после аудита.</div>
 </div>`;

function applyTrace(){
 const svg=$('#architectureSvg');if(!svg)return;
 const reset=$('#clearTrace');if(reset)reset.hidden=!traceState;
 svg.classList.toggle('trace-mode',!!traceState);
 let marked=new Set(),selectedEdges=new Set();
 if(traceState){
  let queue=[{id:traceState.id,d:0}];marked.add(traceState.id);
  while(queue.length){const {id,d}=queue.shift();if(d>=5)continue;
   for(const [a,b] of EDGE_PAIRS){
    let neighbor=(traceState.mode==='effect'&&a===id)?b:(traceState.mode==='cause'&&b===id)?a:null;
    if(neighbor){selectedEdges.add(a+','+b);if(!marked.has(neighbor)){marked.add(neighbor);queue.push({id:neighbor,d:d+1})}}
   }
  }
 }
 svg.querySelectorAll('[data-diagram-id]').forEach(el=>el.classList.toggle('trace-relevant',marked.has(el.dataset.diagramId)));
 svg.querySelectorAll('[data-edge]').forEach(el=>{
  const parts=el.dataset.edge.split(',');el.classList.toggle('trace-relevant',traceState&&(selectedEdges.has(parts.slice(0,2).join(','))||parts.every(p=>marked.has(p))));
 });
}

  {name:'Подпроцессы без держателя',rows:r.subprocesses.filter(x=>!(x.subprocessHolder||x.flowHolder||'').trim()),type:'subprocesses',note:'Не указан ответственный за результат.'},
  {name:'Подпроцессы без критерия приёмки',rows:r.subprocesses.filter(x=>!(x.acceptanceCriteria||'').trim()),type:'subprocesses',note:'Отсутствует критерий завершения.'},
  {name:'Переходы без условия передачи',rows:r.transitions.filter(x=>!(x.condition||'').trim()),type:'transitions',note:'Риск блокировки между процессами.'}
 ];
 return checks;
}
function openToolbox(){
 const items=[['integrity','Контроль полноты','Проверить назначения, результаты и условия передачи'],['scenario','Сценарий устойчивости','Смоделировать возвраты, блокировки и запас мощности'],['metrics','План / факт','Записать проверенные показатели'],['audit','Журнал изменений','Посмотреть изменения этой копии'],['links','Ссылки на инструменты','Настроить переходы к продуктам МЕТА'],['question','Вопрос или гипотеза','Зафиксировать проблему или предложение']];
 openDrawer('Инструменты модели','Диагностика и управление',`<p>Инструменты открываются в карточках, не заменяя единую модель системы.</p>`+items.map(([id,title,desc])=>`<button class="diagnostic-row" data-open-toolbox="${id}" style="display:block;width:100%;border-left:0;border-top:0;border-right:0;background:transparent;text-align:left;color:var(--text);cursor:pointer"><b>${title} →</b><p class="muted small" style="margin:4px 0">${desc}</p></button>`).join(''));
}
function openIntegrity(){
 const checks=integrityReport();const errors=checks.reduce((s,x)=>s+x.rows.length,0);
 const body=`<p>Проверка связности реестров предыдущей версии. Результаты — индикаторы неполноты данных, не доказательство отсутствия работы в реальности.</p><div class="mini-kpi-grid"><div class="kpi-tile"><div class="muted small">Проверок</div><div class="kpi-value">${checks.length}</div></div><div class="kpi-tile"><div class="muted small">Выявленных записей</div><div class="kpi-value">${errors}</div></div></div>`+
 checks.map(c=>`<div class="diagnostic-row"><strong>${esc(c.name)}</strong><div class="diagnostic-count">${c.rows.length}</div><p class="muted small">${esc(c.note)}</p>${c.rows.slice(0,5).map(r=>`<button class="related-button" data-open-register="${c.type}:${r.id}">${esc(r.name||r.id)} ↗</button>`).join('')}${c.rows.length>5?`<span class="muted small">+ ещё ${c.rows.length-5}</span>`:''}</div>`).join('');
 openDrawer('Контроль полноты','Диагностика связности системы',body,`<button class="action" data-open-node="diagnosis">Открыть диагностику на схеме</button>`);
}
function currentScenario(){
 const r=store.resilience,t=+r.target||0,nom=+r.nominal||0,bl=Math.max(0,Math.min(100,+r.block||0)),re=Math.max(0,+r.rework||0),ch=Math.max(0,+r.changes||0),threshold=Math.max(0,+r.reserveThreshold||0);
 const calc=nom*(1-bl/100)/(1+re/100+ch/100),reserve=t?100*(calc-t)/t:null;
 const state=!t||!nom?'Недостаточно данных':calc<t?'Неустойчива по мощности':reserve<threshold?'Напряжена':'Устойчива по запасу мощности';
 return {t,nom,bl,re,ch,threshold,calc,reserve,state};
}
function openScenario(){
 const x=currentScenario(),p=store.resilience;
 const fields=[['target','Цель, м²/год',p.target],['nominal','Номинальная мощность, м²/год',p.nominal],['block','Блокировки, % времени',p.block],['rework','Возвраты: дополнительная трудоёмкость, %',p.rework],['changes','Изменения среды: дополнительная работа, %',p.changes],['reserveThreshold','Порог напряжённости, резерв %',p.reserveThreshold]];
 const body=`<p>Упрощённая сценарная модель. Не является подтверждённым прогнозом или нормативом: для расчёта календарной загрузки нужны данные по стадиям, исполнителям и времени.</p>`+
 `<div class="mini-kpi-grid"><div class="kpi-tile"><div class="muted small">Эффективная мощность</div><div class="kpi-value">${fmt(x.calc)} м²</div></div><div class="kpi-tile"><div class="muted small">Резерв</div><div class="kpi-value">${x.reserve===null?'—':fmt(x.reserve,1)+'%'}</div></div></div><div class="callout" style="margin:12px 0"><b>${x.state}</b><br>Qэфф = Qном × (1 − блокировки) / (1 + доп. трудоёмкость). Порог оценки напряжённости задаётся пользователем.</div>`+
 fields.map(([k,label,value])=>`<label class="compact-field">${esc(label)}<input class="field" type="number" min="0" step="any" data-scenario-field="${k}" value="${esc(value)}"></label>`).join('');
 openDrawer('Сценарный расчёт','Устойчивость и запас мощности',body,`<button class="action primary" id="calcScenario">Пересчитать</button><button class="action" data-open-node="stability">Контур на схеме</button>`);
 $('#calcScenario').onclick=()=>{document.querySelectorAll('[data-scenario-field]').forEach(el=>{let v=Number(el.value);if(Number.isFinite(v))store.resilience[el.dataset.scenarioField]=Math.max(0,v)});recordChange('Сценарий','stability','Изменены параметры сценария');save();openScenario()};
}
function openMetrics(){
 const m=store.metrics;const rows=[['qActual','Фактический объём, м²/год'],['hoursActual','Фактические трудозатраты, чел·ч'],['costActual','Фактическая себестоимость, ₽/м²'],['deadlinePct','Своевременное завершение, %'],['returnsActual','Доля работ с возвратом, %'],['blockedDays','Время блокировок, рабочие дни']];
 const actual=m.qActual===null||m.qActual===''?null:Number(m.qActual),delta=actual===null?null:actual-(Number(store.capacity.baseGoal)||130000);
 let body=`<p>Фактические показатели заполняются вручную. Пустые значения не считаются нулём и не подменяются сценарными расчётами.</p><div class="mini-kpi-grid"><div class="kpi-tile"><div class="muted small">План, м²/год</div><div class="kpi-value">${fmt(store.capacity.baseGoal)}</div></div><div class="kpi-tile"><div class="muted small">Отклонение выпуска</div><div class="kpi-value">${delta===null?'Нет факта':fmt(delta)+' м²'}</div></div></div>`;
 body+=rows.map(([k,label])=>`<label class="compact-field">${esc(label)}<input class="field" type="number" step="any" data-metric-field="${k}" placeholder="Не задано" value="${m[k]===null?'':esc(m[k])}"></label>`).join('');
 openDrawer('План / факт','Фактические показатели работы системы',body,`<button class="action primary" id="saveMetrics">Сохранить факт</button><button class="action" data-open-node="actual">На схеме</button>`);
 $('#saveMetrics').onclick=()=>{document.querySelectorAll('[data-metric-field]').forEach(el=>{const v=el.value.trim();store.metrics[el.dataset.metricField]=v===''?null:Number(v)});recordChange('Факт','actual','Обновлены показатели план/факт');save();openMetrics();toast('Показатели сохранены')};
}
function openAudit(){const a=store.audit||[];openDrawer('Контур управления','История локальных изменений',`<p>Журнал фиксирует действия в этой копии браузера; не является общей историей многопользовательской системы.</p><h4>Записей: ${a.length}</h4>${a.slice(-80).reverse().map(x=>`<div class="diagnostic-row"><b>${esc(x.type)}</b> <span class="muted small">${esc(x.date)}</span><p>${esc(x.description)}</p><span class="muted small">${esc(BASE_NODES[x.id]?.title||x.id)}</span></div>`).join('')||'<p class="muted">Записей пока нет.</p>'}`,`<button class="action" data-open-node="verification">Контур обратной связи</button>`);}
function openLinks(){let names={system:'МЕТА Система',kep:'КЭП',metasebes:'МЕТАСЕБЕС',flow:'Расчёт потока'};
 openDrawer('Инструменты','Перекрёстные ссылки МЕТА',`<p>Два подтверждённых адреса уже заполнены. Для остальных можно задать адрес сайта вручную и экспортировать настройки вместе с моделью.</p>`+Object.keys(names).map(k=>`<label class="compact-field">${names[k]}<input class="field" data-tool-url="${k}" type="url" placeholder="https://" value="${esc(store.toolLinks[k]||'')}"></label>`).join(''),`<button class="action primary" id="saveLinks">Сохранить ссылки</button>`);
 $('#saveLinks').onclick=()=>{let valid=true;$$('[data-tool-url]').forEach(el=>{const v=el.value.trim();if(v&&!/^https:\/\//i.test(v)){valid=false;el.setCustomValidity('Только HTTPS');el.reportValidity();return;}store.toolLinks[el.dataset.toolUrl]=v});if(!valid)return;recordChange('Ссылки','system','Обновлены ссылки на инструменты');save();openLinks();toast('Ссылки сохранены')};
}
// Single event delegation prevents controls from breaking after rerender.
document.addEventListener('click',e=>{const orgGuide=e.target.closest('[data-org-guide]');if(orgGuide){openOrgModel(orgGuide.dataset.orgGuide);return}const toolChoice=e.target.closest('[data-open-toolbox]');if(toolChoice){({integrity:openIntegrity,scenario:openScenario,metrics:openMetrics,audit:openAudit,links:openLinks,question:openQuestion}[toolChoice.dataset.openToolbox])?.();return}const trace=e.target.closest('[data-trace]');if(trace){if(trace.dataset.trace==='clear')resetTrace();else runTrace(trace.dataset.traceId,trace.dataset.trace);return}const toolEditor=e.target.closest('[data-open-link-editor]');if(toolEditor){openLinks();return}const status=e.target.closest('[data-status-for]');if(status){e.stopPropagation();cycleStatus(status.dataset.statusFor);return}const reg=e.target.closest('[data-open-register]');if(reg){const [t,...parts]=reg.dataset.openRegister.split(':');openRegister(t,parts.join(':'));return}const n=e.target.closest('[data-open-node],[data-node]');if(n){openNode(n.dataset.openNode||n.dataset.node);return}const f=e.target.closest('[data-open-flow]');if(f){openFlow(f.dataset.openFlow);return}const a=e.target.closest('[data-open-article]');if(a){openArticle(a.dataset.openArticle);return}const mode=e.target.closest('[data-mode],[data-tool]');if(mode){closeDrawer();setMode(mode.dataset.mode||mode.dataset.tool);return}const c=e.target.closest('[data-collapse]');if(c){store['fold-'+c.dataset.collapse]=!store['fold-'+c.dataset.collapse];save();renderNav();return}});
document.addEventListener('keydown',e=>{
 if(demoState.active&&!e.target.closest('input,textarea,select,[contenteditable]')){
  if(e.key==='ArrowRight'){e.preventDefault();e.shiftKey?moveChapter(1):movePresentation(1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();e.shiftKey?moveChapter(-1):movePresentation(-1);return;}
  if(e.key==='Escape'){togglePresentation();closeDrawer();return;}
 }
 if(e.key==='Escape')closeDrawer();const h=e.target.closest?.('[data-node]');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openNode(h.dataset.node)}});
$('#integrityTool').onclick=openIntegrity;$('#scenarioTool').onclick=openScenario;$('#metricsTool').onclick=openMetrics;$('#auditTool').onclick=openAudit;$('#linksTool').onclick=openLinks;$('#closeDrawer').onclick=closeDrawer;$('#drawerScrim').onclick=closeDrawer;$('#sideSearch').oninput=renderNav;$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#jsonInput').click();$('#jsonInput').onchange=e=>{importData(e.target.files[0]);e.target.value=''};$$('[data-theme-choice]').forEach(b=>b.onclick=()=>setInterfaceTheme(b.dataset.themeChoice));$('#instructionBtn').onclick=openHelp;$('#helpTool').onclick=openHelp;$('#questionTool').onclick=openQuestion;
const mobile=()=>{const show=window.matchMedia('(max-width:750px)').matches;$('#navToggle').style.display=show?'block':'none';if(!show)$('#sidebar').classList.remove('mobile-show')};window.addEventListener('resize',mobile);$('#navToggle').onclick=()=>$('#sidebar').classList.toggle('mobile-show');
setInterfaceTheme(store.theme,false);renderTabs();renderNav();renderView();mobile();
</script></body></html>
