name: Verify TRAIN PWA
on:
  push:
    branches: [main]
    paths:
      - "train/**"
      - ".github/workflows/verify-train.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check train/app.js && node --check train/sw.js && node --check train/tests.cjs && node train/tests.cjs
      - name: Check PWA manifest and required files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('train')
          m=json.loads((p/'manifest.webmanifest').read_text())
          assert m['display']=='standalone'
          assert m['start_url']=='./'
          for f in ['index.html','app.js','sw.js','icon.svg']:
              assert (p/f).is_file(),f
          assert 'serviceWorker.register' in (p/'app.js').read_text()
          print('TRAIN PWA source OK')
          PY
